<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Challenge Form" [options]="false">
      <h5>New Challenge</h5>
      <hr />
      <div class="row">
        <div class="col-md-6">
          <form action="javascript:">
            <div class="form-group">
              <label for="exampleInputEmail1">Challenge Name</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter Challenge name" />
              <small id="emailHelp" class="form-text text-muted">this Field is mandatory</small>
            </div>
            
           
            <div class="form-group">
              <label for="exampleFormControlTextarea1">Challenge Description</label>
              <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1" />
              <label class="form-check-label" for="exampleCheck1">New users Only</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1" />
              <label class="form-check-label" for="exampleCheck1">All users</label>
            </div>
            <h5 class="mt-3">Upload challenge detailed description </h5>
          <hr />
          <div class="input-group mb-3">
            <label for="inputGroupFile01" class="input-group-text">Upload</label>
            <input type="file" class="form-control" id="inputGroupFile01" />
          </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
        <div class="col-md-6">
          <form action="javascript:">
            <div class="form-group">
              <label>Start Date</label>
              <input type="date" class="form-control" placeholder="Text" />
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" class="form-control" placeholder="Text" />
            </div>
            <div class="form-group">
              <label for="exampleFormControlSelect1">Weekly Ride Limits</label>
              <select class="form-control" id="exampleFormControlSelect1">
                <option>5</option>
                <option>10</option>
                <option>15</option>
                <option>20</option>
              </select>
            </div>
            
          </form>
        </div>
      </div>
    </app-card>
  </div>
</div>
